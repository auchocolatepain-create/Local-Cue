name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project
        run: |
          echo "===== WHAT IS ACTUALLY IN THE REPO ====="
          ls -R
          echo "========================================"
          find . -maxdepth 2 -name '*.zip' -exec unzip -o {} -d unpacked \;
          HIT=$(find . -path '*/app/build.gradle.kts' | head -1)
          if [ -z "$HIT" ]; then
            echo "FAILED: app/build.gradle.kts is not in this repo."
            exit 1
          fi
          PROJ=$(dirname "$(dirname "$HIT")")
          echo "Found project at: $PROJ"
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LocalCue-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
